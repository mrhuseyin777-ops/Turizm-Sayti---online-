# Odiola CI: lint, testlər (yaddaş rejimi və real PostgreSQL), asılılıq auditi, E2E (Playwright + Chromium).
# Sirr istifadə olunmur: Postgres yalnız bu iş üçün yaradılan müvəqqəti konteynerdir.
name: CI

on:
  push:
  pull_request:

# Minimum icazələr: yalnız kodu oxumaq
permissions:
  contents: read

# Eyni branch/PR üçün yeni push gələndə köhnə işlər ləğv olunur
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # E2E üçün Playwright paketi layihənin asılılığı deyil — yalnız CI-də bu dəqiq versiya ilə quraşdırılır
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  test:
    name: Lint, testlər, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Asılılıq auditi (production, high+)
        run: npm audit --omit=dev --audit-level=high

  test-db:
    name: Testlər (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odiola
          POSTGRES_PASSWORD: odiola-ci-only
          POSTGRES_DB: odiola_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odiola -d odiola_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Müvəqqəti CI bazası (sirr deyil). test/db.test.js ayrıca sxem yaradıb sonda silir.
      TEST_DATABASE_URL: postgres://odiola:odiola-ci-only@127.0.0.1:5432/odiola_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Playwright (package.json-a yazılmadan)
        run: npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
      - name: Chromium və sistem asılılıqları
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
