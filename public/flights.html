<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurTap — aviabilet axtarışı və müqayisəsi</title>
  <meta name="description" content="Aviabilet qiymətlərini bir neçə satış mənbəyində müqayisə edin: birtərəfli və gediş-dönüş, birbaşa və aktarmalı uçuşlar.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/flights.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="logo" href="/"><span class="logo-mark">✈</span><span>Tur<b>Tap</b></span></a>
      <nav class="nav">
        <a href="/" class="hide-sm" data-i18n="nav_search">Axtarış</a>
        <a href="/flights.html" class="active" data-i18n="nav_flights" aria-current="page">Aviabilet</a>
        <a href="/cars.html" class="hide-sm" data-i18n="nav_cars">Avtomobil</a>
        <a href="/b2b" class="hide-sm" data-i18n="nav_b2b">Agentliklər üçün (B2B)</a>
        <select id="currency" aria-label="Valyuta"></select>
        <select id="lang" aria-label="Dil"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option></select>
      </nav>
    </div>
  </header>

  <section class="hero fl-hero">
    <div class="container">
      <h1 data-i18n="fl_hero_title">Aviabiletlər — bütün mənbələr bir axtarışda</h1>
      <p data-i18n="fl_hero_sub"></p>
    </div>
  </section>

  <div class="container">
    <form class="search-card fl-search" id="flightForm" autocomplete="off" novalidate>
      <div class="fl-top">
        <div class="seg" id="tripSeg" role="group">
          <button type="button" data-trip="oneway" data-i18n="fl_oneway"></button>
          <button type="button" class="active" data-trip="round" data-i18n="fl_round"></button>
        </div>
        <label class="fl-chk"><input type="checkbox" id="direct"> <span data-i18n="fl_direct_only"></span></label>
        <label class="fl-chk"><input type="checkbox" id="bags"> <span data-i18n="fl_bags_incl"></span></label>
      </div>
      <div class="fl-fields">
        <div class="field fl-from"><label for="from" data-i18n="fl_from"></label><input id="from" required data-i18n-ph="fl_from_ph" spellcheck="false"></div>
        <button type="button" class="fl-swap" id="swap" aria-label="Yerlərini dəyiş" title="⇄">⇄</button>
        <div class="field fl-to"><label for="to" data-i18n="fl_to"></label><input id="to" required data-i18n-ph="fl_to_ph" spellcheck="false"></div>
        <div class="field fl-dep"><label for="depart" data-i18n="fl_depart"></label><input id="depart" type="date" required></div>
        <div class="field fl-ret" id="retField"><label for="ret" data-i18n="fl_return"></label><input id="ret" type="date"></div>
      </div>
      <div class="fl-row2">
        <div class="field fl-paxf"><label data-i18n="fl_pax"></label>
          <div class="fl-pax">
            <select id="adults" aria-label="Böyük"></select>
            <select id="children" aria-label="Uşaq"></select>
            <select id="infants" aria-label="Körpə"></select>
          </div>
        </div>
        <div class="field fl-cabinf"><label for="cabin" data-i18n="fl_cabin"></label>
          <select id="cabin"><option value="economy" data-i18n="fl_economy"></option><option value="business" data-i18n="fl_business"></option></select>
        </div>
        <span class="fl-grow"></span>
        <button class="btn" type="submit" data-i18n="btn_search">Axtar</button>
      </div>
      <div class="popular fl-popular"><span class="muted" data-i18n="popular"></span>
        <button type="button" data-route="GYD-IST,SAW">Bakı → İstanbul</button>
        <button type="button" data-route="GYD-DXB">Bakı → Dubay</button>
        <button type="button" data-route="GYD-AYT">Bakı → Antalya</button>
        <button type="button" data-route="GYD-NAJ">Bakı → Naxçıvan</button>
        <button type="button" data-route="GYD-SVO,VKO,DME">Bakı → Moskva</button>
        <button type="button" data-route="GYD-TBS">Bakı → Tbilisi</button>
      </div>
    </form>

    <div id="intro">
      <div class="features">
        <div class="feature"><b data-i18n="fl_feat1_t"></b><p data-i18n="fl_feat1_d"></p></div>
        <div class="feature"><b data-i18n="fl_feat2_t"></b><p data-i18n="fl_feat2_d"></p></div>
        <div class="feature"><b data-i18n="fl_feat3_t"></b><p data-i18n="fl_feat3_d"></p></div>
        <div class="feature"><b data-i18n="fl_feat4_t"></b><p data-i18n="fl_feat4_d"></p></div>
      </div>
      <div class="demo-note" data-i18n="fl_demo_note"></div>
    </div>

    <div class="layout fl-layout" id="resultsLayout" hidden>
      <aside class="panel filters" id="filters">
        <h3 data-i18n="filters"></h3>
        <div class="group"><b data-i18n="fl_stops"></b><div id="stopFilter"></div></div>
        <div class="group"><b data-i18n="fl_dep_time"></b><div id="timeFilter"></div></div>
        <div class="group"><b data-i18n="fl_airlines"></b><div id="airlineFilter"></div></div>
        <div class="group"><b data-i18n="fl_baggage"></b>
          <label class="chk"><input type="checkbox" id="bagsF"> <span data-i18n="fl_bags_only"></span></label>
        </div>
        <div class="group"><b data-i18n="fl_max_price"></b>
          <div class="range" style="margin-top:8px"><input id="maxPrice" type="number" min="0" step="10" data-i18n-ph="f_budget_ph"></div>
        </div>
        <div class="group"><button type="button" class="btn secondary sm" id="resetFilters" data-i18n="fl_reset"></button></div>
      </aside>
      <main class="fl-main-col">
        <div class="fl-agent" id="agentBar" hidden>
          <label class="fl-switch"><input type="checkbox" id="agentMode" checked> <span data-i18n="fl_agent_mode"></span></label>
          <span class="muted" id="agentName"></span>
          <span class="fl-grow"></span>
          <label class="muted fl-comm"><span data-i18n="fl_commission"></span> <input id="commission" type="number" min="0" max="100" step="0.5" value="0"></label>
          <button type="button" class="btn sm" id="quoteBtn"><span data-i18n="fl_client_text"></span> (<span id="selCount">0</span>)</button>
        </div>
        <div class="results-head">
          <div><h2 id="resTitle"></h2><div class="muted" id="resSub"></div></div>
          <button type="button" class="btn secondary sm mobile-filter-btn" id="toggleFilters" data-i18n="filter_btn"></button>
        </div>
        <div class="fl-cal" id="calendar" aria-label="Qiymət təqvimi"></div>
        <div class="fl-sorts" id="sorts" role="tablist"></div>
        <div class="sources" id="sources"></div>
        <div id="results"></div>
        <div class="fl-more-wrap"><button type="button" class="btn secondary sm" id="moreBtn" hidden data-i18n="fl_show_more"></button></div>
        <div class="demo-note" data-i18n="fl_demo_note"></div>
      </main>
    </div>
  </div>

  <div class="modal-bg" id="modal"><div class="modal fl-modal" id="modalBody" role="dialog" aria-modal="true"></div></div>

  <footer><div class="container">© <span id="year"></span> TurTap · <span data-i18n="fl_footer"></span></div></footer>
  <script src="/js/common.js"></script>
  <script src="/js/flights.js"></script>
</body>
</html>
