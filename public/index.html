<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eTour — tur və otel müqayisəsi</title>
  <meta name="description" content="Azərbaycanın bütün tur operatorlarının tur və otel qiymətlərini bir axtarışda müqayisə edin.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/gallery.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="logo" href="/"><span class="logo-mark">✈</span><span>e<b>Tour</b></span></a>
      <nav class="nav">
        <a href="/" class="active" data-i18n="nav_search">Axtarış</a>
        <a href="/flights.html" class="hide-sm" data-i18n="nav_flights">Aviabilet</a>
        <a href="/cars.html" class="hide-sm" data-i18n="nav_cars">Avtomobil</a>
        <a href="/b2b" class="hide-sm" data-i18n="nav_b2b">Agentliklər üçün (B2B)</a>
        <a href="/how.html" class="hide-sm" data-i18n="nav_how">Necə işləyirik</a>
        <select id="currency" aria-label="Valyuta"></select>
        <select id="lang" aria-label="Dil"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option></select>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1 data-i18n="hero_title">Bütün tur operatorları — bir axtarışda</h1>
      <p data-i18n="hero_sub"></p>
      <div class="steps">
        <span><b>1</b><i data-i18n="step1"></i></span>
        <span><b>2</b><i data-i18n="step2"></i></span>
        <span><b>3</b><i data-i18n="step3"></i></span>
      </div>
    </div>
  </section>

  <div class="container">
    <form class="search-card" id="searchForm" autocomplete="off">
      <div class="tabs" id="typeTabs">
        <button type="button" class="tab active" data-type="package" data-i18n="tab_package"></button>
        <button type="button" class="tab" data-type="hotel" data-i18n="tab_hotel"></button>
        <button type="button" class="tab" data-type="tour" data-i18n="tab_tour"></button>
        <span class="sep"></span>
        <div class="seg" id="regionSeg">
          <button type="button" class="active" data-region="" data-i18n="reg_all"></button>
          <button type="button" data-region="intl" data-i18n="reg_intl"></button>
          <button type="button" data-region="domestic" data-i18n="reg_domestic"></button>
        </div>
      </div>
      <div class="fields">
        <div class="field"><label for="dest" data-i18n="f_dest"></label><input id="dest" maxlength="80" data-i18n-ph="f_dest_ph"></div>
        <div class="field wide"><label for="checkIn" data-i18n="f_date_range"></label>
          <div class="pair"><input id="checkIn" type="date" required data-i18n-title="f_date_from"><input id="checkInTo" type="date" data-i18n-title="f_date_to"></div>
        </div>
        <div class="field"><label for="nights" data-i18n="f_nights_range"></label>
          <div class="pair"><select id="nights" data-i18n-title="f_nights_from"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option></select><select id="nightsTo" data-i18n-title="f_nights_to"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option></select></div>
        </div>
        <div class="field"><label data-i18n="f_pax"></label>
          <div class="pax">
            <select id="adults" aria-label="Böyük"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
            <select id="children" aria-label="Uşaq"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
          </div>
        </div>
        <div class="field"><label for="budget" data-i18n="f_budget"></label><input id="budget" type="number" min="0" step="50" data-i18n-ph="f_budget_ph"></div>
        <button class="btn" type="submit" data-i18n="btn_search">Axtar</button>
      </div>
      <div class="child-ages" id="childAges" hidden></div>
      <div class="date-quick" id="dateQuick"><span class="muted" data-i18n="dq_title"></span>
        <button type="button" data-span="0" data-i18n="dq_exact"></button><button type="button" data-span="pm3" data-i18n="dq_pm3"></button>
        <button type="button" data-span="7" data-i18n="dq_7"></button><button type="button" data-span="14" data-i18n="dq_14"></button></div>
      <div class="popular">
        <button type="button" class="explore-link" id="exploreBtn" data-i18n="explore_btn"></button>
        <button type="button" class="explore-link" id="lastMinBtn" data-i18n="lastmin_btn"></button>
        <span class="muted" data-i18n="popular"></span>
        <button type="button" data-q="antalya">Antalya</button><button type="button" data-q="dubai">Dubay</button>
        <button type="button" data-q="sharm">Şarm-əl-Şeyx</button><button type="button" data-q="qabala">Qəbələ</button>
        <button type="button" data-q="shahdag">Şahdağ</button><button type="button" data-q="tbilisi">Tbilisi</button>
      </div>
    </form>

    <div id="intro">
      <section id="lastMinSection" hidden>
        <div class="section-head"><div><h2 data-i18n="lastmin_title"></h2><div class="muted" id="lastMinSub"></div></div>
          <button type="button" class="btn secondary sm" id="lastMinAll" data-i18n="lastmin_all"></button></div>
        <div class="dest-grid" id="lastMinGrid"></div>
      </section>
      <div class="features">
        <div class="feature"><b data-i18n="feat1_t"></b><p data-i18n="feat1_d"></p></div>
        <div class="feature"><b data-i18n="feat2_t"></b><p data-i18n="feat2_d"></p></div>
        <div class="feature"><b data-i18n="feat3_t"></b><p data-i18n="feat3_d"></p></div>
        <div class="feature"><b data-i18n="feat4_t"></b><p data-i18n="feat4_d"></p></div>
      </div>
      <section class="panel callback-card" id="homeCallback">
        <h3 data-i18n="cb_title"></h3><p class="muted" style="margin:0" data-i18n="cb_sub"></p>
        <div id="homeCallbackForm"></div>
      </section>
    </div>

    <div class="layout" id="resultsLayout" hidden>
      <aside class="panel filters" id="filters">
        <h3 data-i18n="filters"></h3>
        <div class="group"><b data-i18n="price"></b>
          <div class="range" style="margin-top:8px"><input id="minPrice" type="number" placeholder="min"><input id="maxPrice" type="number" placeholder="max"></div>
        </div>
        <div class="group"><b data-i18n="stars"></b><div id="starFilter"></div></div>
        <div class="group"><b data-i18n="board"></b><div id="boardFilter"></div></div>
        <div class="group"><b data-i18n="operators"></b><div id="opFilter"></div></div>
        <div class="group"><div id="districtMs" class="inline"></div></div>
        <div class="group"><div id="hotelMs" class="inline"></div></div>
        <div class="group"><b data-i18n="attr_title"></b><div id="attrFilter"></div></div>
        <div class="group"><b data-i18n="f_rating"></b> <span class="demo-tag" data-i18n-title="rating_demo_t">demo</span>
          <div class="pill-radios" id="ratingFilter">
            <label><input type="radio" name="minRating" value="" checked> <span data-i18n="f_any"></span></label>
            <label><input type="radio" name="minRating" value="7"> <span>7+</span></label>
            <label><input type="radio" name="minRating" value="8"> <span>8+</span></label>
            <label><input type="radio" name="minRating" value="8.5"> <span>8.5+</span></label>
            <label><input type="radio" name="minRating" value="9"> <span>9+</span></label>
          </div></div>
        <div class="group"><b data-i18n="f_location"></b> <span class="demo-tag" data-i18n-title="loc_demo_t">demo</span>
          <small class="muted sub-label" data-i18n="f_beach_line"></small>
          <label class="chk"><input type="checkbox" name="beachLines" value="1"> <span data-i18n="line_1"></span></label>
          <label class="chk"><input type="checkbox" name="beachLines" value="2"> <span data-i18n="line_2"></span></label>
          <label class="chk"><input type="checkbox" name="beachLines" value="3"> <span data-i18n="line_3"></span></label>
          <label class="muted sub-label" for="maxDist" data-i18n="f_max_dist"></label>
          <select id="maxDist" class="filter-select"><option value="" data-i18n="f_any"></option><option value="200">≤ 200 m</option><option value="500">≤ 500 m</option><option value="1000">≤ 1 km</option><option value="2000">≤ 2 km</option><option value="5000">≤ 5 km</option></select>
        </div>
        <div class="group"><b data-i18n="avail_title"></b>
          <label class="chk"><input type="checkbox" id="seatsOnly"> <span data-i18n="f_seats"></span></label>
          <label class="chk"><input type="checkbox" id="noStopSale" checked> <span data-i18n="f_no_stop"></span></label>
          <label class="chk"><input type="checkbox" id="instantOnly"> <span data-i18n="f_instant"></span></label></div>
        <div class="group"><label class="chk"><input type="checkbox" id="earlyOnly"> <span data-i18n="early_only"></span></label>
          <label class="chk"><input type="checkbox" id="lastMinuteOnly"> <span id="lastMinLabel"></span></label></div>
        <div class="group"><b data-i18n="f_terms"></b>
          <label class="chk"><input type="radio" name="prepay" value="" checked> <span data-i18n="reg_all"></span></label>
          <label class="chk"><input type="radio" name="prepay" value="none"> <span data-i18n="f_prepay_none"></span></label>
          <label class="chk"><input type="radio" name="prepay" value="upto50"> <span data-i18n="f_prepay_50"></span></label>
          <label class="chk"><input type="checkbox" id="freeCancel"> <span data-i18n="f_free_cancel"></span></label>
        </div>
      </aside>
      <main>
        <div class="results-head">
          <div><h2 id="resTitle"></h2><div class="muted" id="resSub"></div></div>
          <div class="res-tools">
            <div class="seg" id="viewSeg"><button type="button" class="active" data-view="cards" data-i18n="view_cards"></button><button type="button" data-view="table" data-i18n="view_table"></button></div>
            <label class="chk group-chk" id="groupWrap" hidden><input type="checkbox" id="groupBy" checked> <span data-i18n="group_by"></span></label>
            <button class="btn secondary sm mobile-filter-btn" id="toggleFilters" data-i18n="filter_btn"></button>
            <select id="sort" class="btn secondary sm" aria-label="Sort">
              <option value="price" data-i18n="sort_price"></option><option value="price_desc" data-i18n="sort_price_desc"></option>
              <option value="rating" data-i18n="sort_rating"></option><option value="stars" data-i18n="sort_stars"></option><option value="savings" data-i18n="sort_savings"></option><option value="distance" data-i18n="sort_distance"></option>
            </select>
          </div>
        </div>
        <div class="sources" id="sources"></div>
        <div class="rate-wrap" id="rateLine"></div>
        <div id="results"></div>
        <div class="demo-note" data-i18n="demo_note"></div>
      </main>
    </div>
  </div>

  <div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
  <!-- Otel detal pəncərəsi (app.js): Esc, fokus tələsi, ?hotel=<id> ilə paylaşılan link -->
  <div class="modal-bg" id="hotelModal"><div class="modal hd-modal" id="hotelModalBody" role="dialog" aria-modal="true" aria-labelledby="hdTitle" tabindex="-1"></div></div>

  <footer><div class="container"><div id="payStrip"></div>© <span id="year"></span> eTour · Tur operatorlarının qiymət müqayisəsi platforması · <a href="/how.html" data-i18n="how_link">Necə işləyirik</a></div></footer>
  <script src="/js/common.js"></script>
  <script src="/js/hotel-art.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
